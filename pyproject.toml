[project]
name = "sysutils"
version = "1"
description = "olDox System Utils - help tools"
requires-python = ">=3.12"
dependencies = [
    "psutil==7.2.2",
]

[tool.doxoade]
source_dir = "."
shadow_runtime = true
shadow_targets = ["doxoade"]
soteria_active = true
vulcan_turbo = true
shadow_vacuum_check = ["scan", "find", "resolve", "parse"]
keep = [ "coverage", "jsondiff", "pytest", "pyyaml", "radon", "setuptools"]
ignore = [
    # ___ PASTAS _________
    "*./experiments/",
    "*/.doxoade/",
    "*/__pycache__/",
    ".doxoade/",
    ".doxoade_cache/",
    ".git/",
    ".pytest_cache/",
    "__pycache__/",
    "build/",
    "build_soteria_test/",
    "Canone_Test/",
    "commands_test/",
    "dist/",
    "dox_lab/",
    "doxoade.egg-info/",
    "doxoade/diagnostic/",
    "doxoade/tools/benzaiten_gui/native/include/webview/",
    "doxoade/tools/benzaiten_gui/native/include/webview2/",
    "nppBackup/",
    "pytest_temp_dir/",
    "recovery_zone/",
    "regression_tests/",
    "tests/",
    "tmp/",
    "venv/",
    "Vers/",
    "w64devkit/",
    # === EXTENSÕES DE BUILD/SCRIPT ===
    "*.specpython",
    "*.bat",
    "*.sh",
    "*.xml",
    "*.pyd",
    "*.txt",
    "*.json",
    "*.jsonl",
    "*.xml",
    # === EXTENSÕES BINÁRIAS/NATIVAS ===
    "*.hh",
    "*.dll",
    "*.exe",
    # === EXTENSÕES DE BACKUP/LIXO ===
    "*.bkp",
    "*.old",
    "*.bak",
    "*.tmp",
    "*.temp",
    "*.log",
    "*.cache",
    "*.nxa",
    "*.jsonl",
    "*.conf",
    "*.ini",
    "*.whitelist_backup",
    "*.hbc5_backup",
    "*.final_backup",
    # ___ DATABASE _________
    "data/",
    "*.db-journal",
    "*.sqlite",
    "*.sqlite3",
    "*.sqlite-shm",
    "*.sqlite-wal",
    "*.sqlite-journal",
    "*.db",
    "*.db-shm",
    "*.db-wal",
    # ___ RELATÓRIOS _________
    "chief_dossier_*.xml",
    "*_dossier_*.xml",
]

# pyproject.toml do Projeto SysUtils
[tool.doxoade.bricks]
vulcan_dict = "diskdiag/core/vulcan_dict.py"
vulcan_bitmap = "diskdiag/core/vulcan_bitmap.py"




[tool.doxoade.lan_git]
enabled = true
silo_name = "Projeto SysUtils"
default_port = 9418
smart_http_port = 8080
