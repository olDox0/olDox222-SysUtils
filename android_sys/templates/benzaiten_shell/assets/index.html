<!DOCTYPE html>
<!-- android_sys/templates/benzaiten_shell/assets/index.html -->
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Benzaiten NeoGUI Mobile</title>
    <style>
        :root {
            --bg: #0F0D0F;
            --panel: #19171A;
            --border: #4C4552;
            --accent: #26BC5F;
            --text: #D2DCE6;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        h1 { font-size: 20px; color: var(--accent); }
        .badge {
            background: #197B3F;
            color: #FFF;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
        }
        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 15px;
        }
        .btn {
            background: var(--accent);
            color: #0F0D0F;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn:active { opacity: 0.8; }
        #console {
            background: #000;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            flex: 1;
            overflow-y: auto;
            color: #38BC5F;
        }
    </style>
    <script src="dx_bridge.js"></script>
</head>
<body>
    <header>
        <h1>🐉 Benzaiten NeoGUI</h1>
        <span class="badge">MOBILE SHELL</span>
    </header>

    <div class="card">
        <h3>Ponte Hermes Nativa</h3>
        <p style="font-size: 13px; color: #888; margin-top: 5px;">
            Ambiente móvel desacoplado. Controle por linha de comando ativo via SysUtils.
        </p>
        <button class="btn" onclick="testBridge()">⚡ Testar Envio Hermes</button>
    </div>

    <div id="console">[SISTEMA] Aguardando comandos...</div>

    <script>
        function log(msg) {
            const c = document.getElementById('console');
            c.innerHTML += '<br>&gt; ' + msg;
            c.scrollTop = c.scrollHeight;
        }

        async function testBridge() {
            log('Enviando ping para o backend via __dx_send__...');
            try {
                const res = await window.__dx_send__('ping', { timestamp: Date.now() });
                log('Resposta: ' + JSON.stringify(res));
            } catch(e) {
                log('Erro: ' + e.message);
            }
        }
    </script>
</body>
</html>
